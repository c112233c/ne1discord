apiVersion: v1
kind: Service
metadata:
  name: ne1discord-be-30096
  namespace: boat
  labels:
    app: ne1discord-be-30096
spec:
  type: {{ .Values.service.type }}
  selector:
    app: ne1discord-be-30096
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{ if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{ end }}
