apiVersion: apps/v1
kind: Deployment
metadata:
  name: ne1discord-be-30096
  namespace: boat
  labels:
    app: ne1discord-be-30096
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ne1discord-be-30096
  template:
    metadata:
      labels:
        app: ne1discord-be-30096
    spec:
      {{ with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{ end }}
      containers:
        - name: ne1discord-be-30096
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{ range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{ end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
