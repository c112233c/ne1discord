name: Build and Deploy ne1discord-be

on:
  push:
    branches:
      - main
    paths:
      - "ne1discord-be/**"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ne1discord-be/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ne1discord-be-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ne1discord-be

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ne1discord-be
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ne1discord-be/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=low

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ne1discord-be
          file: ./ne1discord-be/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Helm image reference
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("ne1discord-gitops/be/values.yaml")
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          found_repository = False
          found_tag = False
          for line in lines:
              if line.startswith("  repository:"):
                  updated.append(f'  repository: {os.environ["IMAGE_NAME"]}')
                  found_repository = True
              elif line.startswith("  tag:"):
                  updated.append(f'  tag: "{os.environ["IMAGE_TAG"]}"')
                  found_tag = True
              else:
                  updated.append(line)
          if not found_repository or not found_tag:
              raise SystemExit("Expected image.repository and image.tag entries were not found in values.yaml")
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

      - name: Commit and push GitOps image reference
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ne1discord-gitops/be/values.yaml
          if git diff --cached --quiet; then
            echo "GitOps image reference is already up to date."
            exit 0
          fi
          git commit -m "chore(gitops): deploy ne1discord-be ${IMAGE_TAG}"
          git push origin HEAD:main
